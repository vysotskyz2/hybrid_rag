[project]
name = "docs-rag"
version = "0.1.0"
description = "Hybrid RAG over FastAPI documentation with BM25, dense retrieval, and reranking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.8",
    "qdrant-client>=1.15",
    "sentence-transformers>=3.0",
    "streamlit>=1.66.1",
    "structlog>=25.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
docs-rag = "docs_rag.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.15",
    "pre-commit>=4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "integration: requires downloaded embedding models or external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
